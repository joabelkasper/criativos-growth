<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Criativos Growth{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">Criativos <span>Growth</span></h1>
            <p class="tagline">Gerador de criativos para tráfego pago</p>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer>
        <div class="container">
            <p>Criativos Growth &mdash; Gerador de criativos para campanhas de tráfego pago</p>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
